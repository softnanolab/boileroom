name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      run-target:
        description: "Manual target (none does no paid work; full-suite is the legacy broad suite)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - minifold
          - profam
          - full-suite
      validation-mode:
        description: "Selected gate; public-modal after core"
        required: false
        default: "core"
        type: choice
        options:
          - core
          - public-modal
          - cpu-sif
          - cpu-vm-probe
          - cpu-vm-sif
          - cpu-vm-extract-probe
          - cpu-vm-extract-sif
      profam-gpu:
        description: "ProFam GPU only; L4 follow-on after the T4 gate passes"
        required: false
        default: "T4"
        type: choice
        options:
          - T4
          - L4
      minifold-size:
        description: "Exactly one MiniFold variant; ignored for other targets"
        required: false
        default: "12L"
        type: choice
        options:
          - 12L
          - 48L
      execution-mode:
        description: "Run integration tests in parallel model shards or in series"
        required: false
        default: "parallel"
        type: choice
        options:
          - parallel
          - series
      image-tag:
        description: "Optional explicit Docker/Modal image tag override"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 2 * * 0"
  # Run after the image-build workflow succeeds on main so integration tests
  # exercise the freshly-published image for the exact main commit that built it.
  workflow_run:
    workflows: ["Build and Push Boileroom Images"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency: integration-tests-${{ github.event.workflow_run.head_sha || github.ref }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.run-target == 'full-suite')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pin to the commit that triggered the image build, otherwise the default
          # checkout would pick up a later main commit whose image is not yet built.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # derive_version.py needs the full history to count commits since the baseline.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: integration-tests

      - name: Resolve freshly-built image tag
        id: resolve_tag
        env:
          IMAGE_TAG_OVERRIDE: ${{ github.event.inputs.image-tag || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          if [ -n "$IMAGE_TAG_OVERRIDE" ]; then
            echo "docker_tag=$IMAGE_TAG_OVERRIDE" >> "$GITHUB_OUTPUT"
          elif [ -n "$WORKFLOW_RUN_HEAD_SHA" ]; then
            uv run --no-project --with click python scripts/ci/derive_version.py \
              --head-ref "$WORKFLOW_RUN_HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            uv run --no-project --with click python scripts/ci/derive_version.py \
              --head-ref HEAD \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install huggingface_hub safetensors

      - name: Install the package
        run: uv pip install -e .

      - name: Run integration tests
        shell: bash -l {0}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_API_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_API_TOKEN_SECRET }}
          MODAL_CONFIG_PATH: /dev/null
        run: |
          if [ "${{ inputs.execution-mode || 'parallel' }}" = "series" ]; then
            uv run pytest -v -m integration --image-tag "${{ steps.resolve_tag.outputs.docker_tag }}"
          else
            uv run pytest -v -n 4 --dist loadgroup -m integration --image-tag "${{ steps.resolve_tag.outputs.docker_tag }}"
          fi

  model-validation:
    # This route never runs on push, schedule, workflow_run, or a default dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.run-target == 'minifold' || inputs.run-target == 'profam') &&
      (inputs.validation-mode == 'core' || inputs.validation-mode == 'public-modal' || inputs.validation-mode == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VALIDATION_MODEL: ${{ inputs.run-target }}
      VALIDATION_MODE: ${{ inputs.validation-mode || 'core' }}
      PROFAM_GPU: ${{ inputs.profam-gpu || 'T4' }}
      MINIFOLD_SIZE: ${{ inputs.minifold-size || '12L' }}
      MODAL_CONFIG_PATH: /dev/null
      ARTIFACT_DIR: /tmp/boileroom-validation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Plan selected validation without contacting Modal
        run: |
          gpu_args=()
          if [ "$VALIDATION_MODEL" = "profam" ]; then
            gpu_args=(--profam-gpu "$PROFAM_GPU")
          fi
          uv run --no-project python scripts/testing/run_model_validation.py \
            --model "$VALIDATION_MODEL" --mode "$VALIDATION_MODE" --minifold-size "$MINIFOLD_SIZE" \
            --expected-sha "$GITHUB_SHA" --output-dir "$ARTIFACT_DIR" "${gpu_args[@]}"

      - name: Run one bounded source-image validation
        timeout-minutes: 55
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_API_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_API_TOKEN_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          gpu_args=()
          if [ "$VALIDATION_MODEL" = "profam" ]; then
            gpu_args=(--profam-gpu "$PROFAM_GPU")
          fi
          uv run --no-project --with modal==1.3.0.post1 --with numpy==2.2.6 \
            --with httpx --with pyyaml --with biotite --with scipy \
            python -u scripts/testing/run_model_validation.py \
            --model "$VALIDATION_MODEL" --mode "$VALIDATION_MODE" --minifold-size "$MINIFOLD_SIZE" \
            --expected-sha "$GITHUB_SHA" --output-dir "$ARTIFACT_DIR" "${gpu_args[@]}" --execute \
            2>&1 | tee "$ARTIFACT_DIR/launcher.log"

      - name: Stop only this validation's temporary apps
        if: always()
        timeout-minutes: 3
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_API_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_API_TOKEN_SECRET }}
        run: |
          uv run --no-project --with modal==1.3.0.post1 \
            python scripts/testing/run_model_validation.py \
            --output-dir "$ARTIFACT_DIR" --cleanup-only

      - name: Upload validation reports, logs and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-${{ inputs.run-target }}-${{ inputs.validation-mode || 'core' }}-${{ inputs.minifold-size || '12L' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 14

  cpu-sif-validation:
    # Explicit CPU-only follow-on; never publishes images or receives Modal credentials.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.run-target == 'minifold' || inputs.run-target == 'profam') &&
      inputs.validation-mode == 'cpu-sif'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      VALIDATION_MODEL: ${{ inputs.run-target }}
      MINIFOLD_SIZE: ${{ inputs.minifold-size || '12L' }}
      ARTIFACT_DIR: /tmp/boileroom-cpu-sif-${{ github.run_id }}-${{ github.run_attempt }}
      APPTAINER_SOURCE: /tmp/apptainer-1.5.4-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Build verified official non-setuid Apptainer in task scratch
        timeout-minutes: 12
        run: bash scripts/testing/build_cpu_apptainer.sh

      - name: Plan selected CPU SIF validation
        run: |
          uv run --no-project python scripts/testing/run_cpu_sif_validation.py \
            --model "$VALIDATION_MODEL" --minifold-size "$MINIFOLD_SIZE" \
            --expected-sha "$GITHUB_SHA" --output-dir "$ARTIFACT_DIR" \
            --apptainer-source "$APPTAINER_SOURCE"

      - name: Build local canonical SIF and validate one public CPU backend
        timeout-minutes: 42
        shell: bash
        run: |
          set -o pipefail
          uv run --no-project --with modal==1.3.0.post1 --with numpy==2.2.6 \
            --with httpx --with pyyaml --with biotite --with scipy \
            python -u scripts/testing/run_cpu_sif_validation.py \
            --model "$VALIDATION_MODEL" --minifold-size "$MINIFOLD_SIZE" \
            --expected-sha "$GITHUB_SHA" --output-dir "$ARTIFACT_DIR" \
            --apptainer-source "$APPTAINER_SOURCE" --execute \
            2>&1 | tee "$ARTIFACT_DIR/launcher.log"

      - name: Clean only this CPU validation's temporary resources
        if: always()
        timeout-minutes: 2
        run: |
          status=0
          if [ -f "$ARTIFACT_DIR/run.json" ]; then
            uv run --no-project python scripts/testing/run_cpu_sif_validation.py \
              --model "$VALIDATION_MODEL" --output-dir "$ARTIFACT_DIR" --cleanup-only || status=$?
          fi
          root="$RUNNER_TEMP/boileroom-apptainer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -e "$root" ]; then
            test ! -L "$root"
            test "$(cat "$root/.owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
            rm -rf -- "$root"
            rm -f -- "$APPTAINER_SOURCE"
            mkdir -p "$ARTIFACT_DIR"
            echo 'Owned source toolchain and archive removed' > "$ARTIFACT_DIR/toolchain-cleanup.txt"
          fi
          exit "$status"

      - name: Upload CPU SIF evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-${{ inputs.run-target }}-cpu-sif-${{ inputs.minifold-size || '12L' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 14


  cpu-vm-validation:
    # MiniFold-only test VM: first a no-weights capability probe, then an explicit SIF follow-on.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.validation-mode == 'cpu-vm-probe' || inputs.validation-mode == 'cpu-vm-sif' ||
       inputs.validation-mode == 'cpu-vm-extract-probe' || inputs.validation-mode == 'cpu-vm-extract-sif')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VALIDATION_MODEL: ${{ inputs.run-target }}
      VALIDATION_MODE: ${{ inputs.validation-mode }}
      MINIFOLD_SIZE: ${{ inputs.minifold-size || '12L' }}
      MODAL_CONFIG_PATH: /dev/null
      ARTIFACT_DIR: /tmp/boileroom-cpu-vm-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Plan bounded MiniFold CPU VM route
        shell: bash
        run: |
          test "$VALIDATION_MODEL" = minifold
          test "$MINIFOLD_SIZE" = 12L
          mode_args=()
          if [[ "$VALIDATION_MODE" = cpu-vm-sif || "$VALIDATION_MODE" = cpu-vm-extract-sif ]]; then
            mode_args=(--run-model-after-probe)
          fi
          if [[ "$VALIDATION_MODE" = cpu-vm-extract-probe || "$VALIDATION_MODE" = cpu-vm-extract-sif ]]; then
            mode_args+=(--sif-runtime unsquash)
          fi
          uv run --no-project python scripts/testing/run_cpu_vm_validation.py \
            --expected-sha "$GITHUB_SHA" --output-dir "$ARTIFACT_DIR" "${mode_args[@]}"

      - name: Execute approved CPU VM probe or gated SIF run
        timeout-minutes: 55
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_API_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_API_TOKEN_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          mode_args=()
          if [[ "$VALIDATION_MODE" = cpu-vm-sif || "$VALIDATION_MODE" = cpu-vm-extract-sif ]]; then
            mode_args=(--run-model-after-probe)
          fi
          if [[ "$VALIDATION_MODE" = cpu-vm-extract-probe || "$VALIDATION_MODE" = cpu-vm-extract-sif ]]; then
            mode_args+=(--sif-runtime unsquash)
          fi
          uv run --no-project --with modal==1.6.1 \
            python -u scripts/testing/run_cpu_vm_validation.py \
            --expected-sha "$GITHUB_SHA" --output-dir "$ARTIFACT_DIR" "${mode_args[@]}" --execute \
            2>&1 | tee "$ARTIFACT_DIR/launcher.log"

      - name: Terminate only this CPU VM validation's resources
        if: always()
        timeout-minutes: 3
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_API_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_API_TOKEN_SECRET }}
        run: |
          if [ -f "$ARTIFACT_DIR/vm-run.json" ]; then
            uv run --no-project --with modal==1.6.1 \
              python scripts/testing/run_cpu_vm_validation.py \
              --output-dir "$ARTIFACT_DIR" --cleanup-only
          fi

      - name: Upload CPU VM evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-minifold-${{ inputs.validation-mode }}-12L-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
